<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>JPhotography</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet"/>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Playfair Display', serif;
      color: #222;
      background: #fff;
    }

    .navbar {
      border-bottom: 1px solid #ddd;
      padding: 16px 40px;
      background: #fff !important;
    }

    .navbar-brand {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      font-weight: 700;
      color: #111 !important;
      letter-spacing: 1px;
    }

    .navbar-nav .nav-link {
      font-family: 'Playfair Display', serif;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #555 !important;
      margin-left: 10px;
      font-weight: 400;
      transition: color 0.2s;
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 6px 14px;
    }

    .navbar-nav .nav-link:hover {
      color: #111 !important;
    }

    .navbar-nav .nav-link.active {
      border: 1px solid #aaa;
      border-radius: 6px;
      color: #111 !important;
    }

    .hero {
      text-align: center;
      padding: 70px 20px 40px;
    }

    .hero h1 {
      font-family: 'Playfair Display', serif;
      font-size: 30px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #111;
    }

    .hero p.tagline {
      font-size: 14px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #999;
    }

    .filter-section {
      text-align: center;
      margin: 30px 0 20px;
    }

    .filter-section .btn-filter {
      font-family: 'Playfair Display', serif;
      font-size: 14px;
      letter-spacing: 1px;
      border: 1px solid transparent;
      border-radius: 50px;
      padding: 5px 18px;
      margin: 0 4px;
      color: #555;
      background: transparent;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-section .btn-filter.active {
      border: 1px solid #aaa;
      color: #111;
    }

    .filter-section .btn-filter:hover {
      color: #111;
    }

    .portfolio-grid {
      padding: 10px 40px 60px;
    }

    .portfolio-grid .col {
      padding: 4px;
    }

    .portfolio-grid img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      display: block;
      filter: grayscale(20%);
      transition: transform 0.3s ease, filter 0.3s ease;
    }

    .portfolio-grid img:hover {
      transform: scale(1.03);
      filter: grayscale(0%);
    }

    .img-wrap {
      overflow: hidden;
    }

    footer {
      border-top: 1px solid #ddd;
      text-align: center;
      padding: 30px 20px;
    }

    footer .brand {
      font-family: 'Playfair Display', serif;
      font-size: 18px;
      font-weight: 700;
      color: #111;
      margin-bottom: 4px;
    }

    footer .copy {
      font-size: 11px;
      color: #aaa;
      margin-bottom: 12px;
    }

    footer .social-icons a {
      color: #888;
      font-size: 16px;
      margin: 0 5px;
      text-decoration: none;
      transition: color 0.2s;
    }

    footer .social-icons a:hover {
      color: #111;
    }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand navbar-light bg-white">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">JPhotography</a>
      <div class="navbar-collapse">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="#">About Me</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Portfolio</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <section class="hero">
    <h1>Hi. Hello.. I Am JohnDas...!</h1>
    <h1>I Travel Around The World To Get The Best Photos.!</h1>
    <p class="tagline">Award Winning Photographer / Cinematographer / Writer</p>
  </section>

  <div class="filter-section">
    <button class="btn-filter active" onclick="filterPortfolio('all', this)">All</button>
    <button class="btn-filter" onclick="filterPortfolio('landscape', this)">Landscape</button>
    <button class="btn-filter" onclick="filterPortfolio('portrait', this)">Portrait</button>
    <button class="btn-filter" onclick="filterPortfolio('wedding', this)">Wedding</button>
  </div>

  <div class="portfolio-grid">
    <div class="container-fluid">
      <div class="row row-cols-2 row-cols-md-4" id="portfolioGrid">

        <div class="col portfolio-item" data-category="landscape">
          <div class="img-wrap">
            <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=400&q=80" alt="Landscape 1"/>
          </div>
        </div>
        <div class="col portfolio-item" data-category="portrait">
          <div class="img-wrap">
            <img src="https://images.unsplash.com/photo-1552374196-c4e7ffc6e126?w=400&q=80" alt="Portrait 1"/>
          </div>
        </div>
        <div class="col portfolio-item" data-category="portrait">
          <div class="img-wrap">
            <img src="https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?w=400&q=80" alt="Portrait 2"/>
          </div>
        </div>
        <div class="col portfolio-item" data-category="landscape">
          <div class="img-wrap">
            <img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?w=400&q=80" alt="Landscape 2"/>
          </div>
        </div>

        <div class="col portfolio-item" data-category="portrait">
          <div class="img-wrap">
            <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=400&q=80" alt="Portrait 3"/>
          </div>
        </div>
        <div class="col portfolio-item" data-category="portrait">
          <div class="img-wrap">
            <img src="https://images.unsplash.com/photo-1504257432389-52343af06ae3?w=400&q=80" alt="Portrait 4"/>
          </div>
        </div>
        <div class="col portfolio-item" data-category="portrait">
          <div class="img-wrap">
            <img src="https://images.unsplash.com/photo-1499996860823-5214fcc65f8f?w=400&q=80" alt="Portrait 5"/>
          </div>
        </div>
        <div class="col portfolio-item" data-category="landscape">
          <div class="img-wrap">
            <img src="https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?w=400&q=80" alt="Landscape 3"/>
          </div>
        </div>

        <div class="col portfolio-item" data-category="wedding">
          <div class="img-wrap">
            <img src="https://images.unsplash.com/photo-1519741497674-611481863552?w=400&q=80" alt="Wedding 1"/>
          </div>
        </div>
        <div class="col portfolio-item" data-category="landscape">
          <div class="img-wrap">
            <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=400&q=80" alt="Landscape 4"/>
          </div>
        </div>
        <div class="col portfolio-item" data-category="landscape">
          <div class="img-wrap">
            <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=400&q=80" alt="Landscape 5"/>
          </div>
        </div>
        <div class="col portfolio-item" data-category="portrait">
          <div class="img-wrap">
            <img src="https://images.unsplash.com/photo-1501196354995-cbb51c65aaea?w=400&q=80" alt="Portrait 6"/>
          </div>
        </div>

        <div class="col portfolio-item" data-category="portrait">
          <div class="img-wrap">
            <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=400&q=80" alt="Portrait 7"/>
          </div>
        </div>
        <div class="col portfolio-item" data-category="landscape">
          <div class="img-wrap">
            <img src="https://images.unsplash.com/photo-1444464666168-49d633b86797?w=400&q=80" alt="Landscape 6"/>
          </div>
        </div>
        <div class="col portfolio-item" data-category="landscape">
          <div class="img-wrap">
            <img src="https://images.unsplash.com/photo-1504701954957-2010ec3bcec1?w=400&q=80" alt="Landscape 7"/>
          </div>
        </div>
        <div class="col portfolio-item" data-category="wedding">
          <div class="img-wrap">
            <img src="https://images.unsplash.com/photo-1465495976277-4387d4b0b4c6?w=400&q=80" alt="Wedding 2"/>
          </div>
        </div>

      </div>
    </div>
  </div>

  <footer>
    <p class="brand">JPhotography</p>
    <p class="copy">© Copyright 2024. All Rights Reserved.</p>
    <div class="social-icons">
      <a href="#"><i class="bi bi-instagram"></i></a>
      <a href="#"><i class="bi bi-behance"></i></a>
      <a href="#"><i class="bi bi-dribbble"></i></a>
      <a href="#"><i class="bi bi-camera"></i></a>
      <a href="#"><i class="bi bi-facebook"></i></a>
      <a href="#"><i class="bi bi-twitter"></i></a>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    function filterPortfolio(category, btn) {
      document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.portfolio-item').forEach(item => {
        if (category === 'all' || item.dataset.category === category) {
          item.style.display = 'block';
        } else {
          item.style.display = 'none';
        }
      });
    }
  </script>

</body>
</html>
